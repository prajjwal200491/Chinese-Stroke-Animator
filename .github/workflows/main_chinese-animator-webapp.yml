# Build and deploy the Node.js API (Backend/) to Azure App Service.
# Docs: https://github.com/Azure/webapps-deploy
name: Build and deploy API - chinese-animator-webapp

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '.github/workflows/main_chinese-animator-webapp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies (sanity build)
        run: npm install
        working-directory: ./Backend

      # Zip ONLY the Backend folder contents so app.js sits at the wwwroot root,
      # which matches the App Service startup command "node app.js".
      # node_modules and the local .env are excluded; Azure/Oryx installs deps
      # server-side (SCM_DO_BUILD_DURING_DEPLOYMENT=true) and secrets come from
      # App Service > Configuration.
      - name: Zip Backend for deployment
        run: |
          cd Backend
          zip -r ../release.zip . -x "node_modules/*" ".env"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-api
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-api

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chinese-animator-webapp'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F69D7E2D5E4C404DA1240DD4F0B8BA10 }}
