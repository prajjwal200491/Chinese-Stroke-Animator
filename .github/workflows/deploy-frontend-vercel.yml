# Build and deploy the Angular UI (HanziAnimationUI/) to Vercel production.
# Requires one repo secret: VERCEL_TOKEN (create at https://vercel.com/account/tokens).
# The org/project IDs below are not secret (they identify, not authorize).
name: Deploy UI to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'HanziAnimationUI/**'
      - '.github/workflows/deploy-frontend-vercel.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_KpVTuDajqpyEPXExHu7ffGZi
  VERCEL_PROJECT_ID: prj_68DAhpH2N0wVzYTw3521W8pmwH0u

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HanziAnimationUI
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # vercel build honors HanziAnimationUI/vercel.json, which sets
      # NODE_OPTIONS=--openssl-legacy-provider (needed for the Angular 13 build).
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
