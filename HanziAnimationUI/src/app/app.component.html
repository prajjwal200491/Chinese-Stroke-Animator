
<div class="global-loading-bar" *ngIf="loading.pending$ | async"></div>
<div class="global-loading-overlay" *ngIf="loading.pending$ | async" role="status" aria-live="polite">
  <div class="global-loading-card">
    <span class="global-loading-card__spinner"></span>
    <ng-container *ngIf="wakeup.waking$ | async; else plainLoading">
      <span class="global-loading-card__title">Starting the server…</span>
      <span class="global-loading-card__hint">This can take up to a minute after the app has been idle.</span>
    </ng-container>
    <ng-template #plainLoading>
      <span class="global-loading-card__title">Loading…</span>
    </ng-template>
  </div>
</div>
<app-header></app-header>
<router-outlet></router-outlet>
